  TIMSCO CONNECTOR v1.1.0 — WEBFLOW HTML EMBED (IFRAME + AUTO-RESIZE)
  =============================================================================
  ИНСТРУКЦИЯ ДЛЯ WEBFLOW (RU):
  1. Загрузите папку релиза `TimscoConnector_v1.1.0_Release/` целиком на статический
     HTTPS-хостинг (Cloudflare Pages, Netlify Drop, GitHub Pages или свой поддомен).
     В ней уже лежит и `index.html`, и `TimscoConnectorSetup_v1.1.0.exe` (232 KB,
     SHA-256: d70f9807fe637634257f2bbf8975eb7dd990ee7ce119de64521397790be53a47).
  2. Либо, если хостите `.exe` отдельно (GitHub Releases / Cloudflare R2 / AWS S3,
     т.к. Webflow Assets не принимает .exe), пропишите URL в `DOWNLOAD_URL` внутри
     `index.html` или передайте `&downloadUrl=https://...` в атрибуте `src` ниже.
  3. В Webflow Designer добавьте элемент `Code Embed` в секцию страницы и вставьте
     код НИЖЕ, заменив `sayedibraimov.github.io` на ваш HTTPS-домен.
     - Русская страница: `?embed=1&lang=ru`
     - Английская страница: `?embed=1&lang=en`

  WEBFLOW INSTRUCTIONS (EN):
  1. Deploy the `TimscoConnector_v1.1.0_Release/` folder to a static HTTPS host
     (Cloudflare Pages, Netlify Drop, GitHub Pages, or a custom subdomain). It
     bundles both `index.html` and `TimscoConnectorSetup_v1.1.0.exe` ready to serve.
  2. Alternatively, host `TimscoConnectorSetup_v1.1.0.exe` on GitHub Releases,
     Cloudflare R2, or AWS S3 (Webflow Assets blocks .exe) and pass `&downloadUrl=...`
     or set `DOWNLOAD_URL` inside `index.html`.
  3. Paste the snippet below into a Webflow `Code Embed` component and replace
     `sayedibraimov.github.io` with your HTTPS domain.

-->

<div class="timsco-connector-embed" style="width:100%;max-width:1360px;margin:0 auto;background:#FFFFFF;">
  <iframe
    id="timsco-connector-iframe"
    src="https://sayedibraimov.github.io/timsco-connector/index.html?embed=1&lang=ru"
    title="Timsco Connector v1.1.0 — Autodesk Revit 2026 MCP App"
    style="width:100%;height:1400px;min-height:900px;border:0;display:block;overflow:hidden;background:#FFFFFF;"
    loading="lazy"
    scrolling="no"
    allow="clipboard-write"
  ></iframe>
</div>

<script>
  (function () {
    "use strict";
    var iframe = document.getElementById("timsco-connector-iframe");
    if (!iframe) return;

    var expectedOrigin = null;
    try {
      if (iframe.src ) {
        expectedOrigin = new URL(iframe.src).origin;
      }
    } catch (e) {
      expectedOrigin = null;
    }

    window.addEventListener("message", function (event) {
      if (expectedOrigin && event.origin !== expectedOrigin) return;
      if (!event.data || event.data.type !== "timsco-connector:resize") return;
      var nextHeight = Number(event.data.height);
      if (Number.isFinite(nextHeight) && nextHeight >= 400 && nextHeight <= 25000) {
        iframe.style.height = Math.ceil(nextHeight) + "px";
      }
    });
  })();
</script>
